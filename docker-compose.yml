services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      AUTH_ENABLED: "true"
      ALLOW_INSECURE_AUTH: "false"
      OPENAI_API_BASE: http://host.docker.internal:1234/v1
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      BRAND_VOICE_DATASET_DIR: /app/data/brand_voice
      ALLOWED_ORIGINS: '["http://127.0.0.1:3000","http://localhost:3000"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    build: ./backend
    command: ["python", "worker.py"]
    env_file: ./backend/.env
    environment:
      AUTH_ENABLED: "true"
      ALLOW_INSECURE_AUTH: "false"
      OPENAI_API_BASE: http://host.docker.internal:1234/v1
      CHROMA_PERSIST_DIR: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      BRAND_VOICE_DATASET_DIR: /app/data/brand_voice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
